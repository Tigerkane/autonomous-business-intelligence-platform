<svg width="64" height="64" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fav-plate-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151A38" />
      <stop offset="50%" stop-color="#0B1124" />
      <stop offset="100%" stop-color="#030714" />
    </linearGradient>
    <radialGradient id="fav-glow-dark" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.30" />
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#030714" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fav-rim-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#6366F1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.75" />
    </linearGradient>

    <style>
      .fav-bg { fill: #FFFFFF; stroke: #CBD5E1; }
      .fav-b1 { fill: #312E81; }
      .fav-b2 { fill: #4F46E5; }
      .fav-b3 { fill: #0D9488; }
      .fav-line-pri { stroke: #0D9488; stroke-width: 1.5px; }
      .fav-line-sec { stroke: #0D9488; stroke-width: 1.1px; opacity: 0.65; }
      .fav-node-1 { fill: #312E81; }
      .fav-node-2 { fill: #4F46E5; }
      .fav-node-3 { fill: #0D9488; }
      .fav-spark { fill: #0D9488; }

      @media (prefers-color-scheme: dark) {
        .fav-bg { fill: url(#fav-plate-dark); stroke: url(#fav-rim-dark); }
        .fav-b1 { fill: #6366F1; }
        .fav-b2 { fill: #818CF8; }
        .fav-b3 { fill: #38BDF8; }
        .fav-line-pri { stroke: #A78BFA; stroke-width: 1.4px; }
        .fav-line-sec { stroke: #A78BFA; stroke-width: 1.0px; opacity: 0.55; }
        .fav-node-1 { fill: #6366F1; }
        .fav-node-2 { fill: #818CF8; }
        .fav-node-3 { fill: #38BDF8; }
        .fav-spark { fill: #34D399; }
      }
    </style>
  </defs>

  <!-- Adaptive Badge -->
  <rect x="2" y="2" width="40" height="40" rx="11" class="fav-bg" stroke-width="1.2" />

  <!-- Three ascending bars -->
  <rect x="9" y="24" width="5.5" height="11" rx="2.75" class="fav-b1" />
  <rect x="19.25" y="17" width="5.5" height="18" rx="2.75" class="fav-b2" />
  <rect x="29.5" y="10" width="5.5" height="25" rx="2.75" class="fav-b3" />

  <!-- Neural network links -->
  <line x1="11.75" y1="25.5" x2="22" y2="18.5" class="fav-line-pri" stroke-linecap="round" />
  <line x1="22" y1="18.5" x2="32.25" y2="11.5" class="fav-line-pri" stroke-linecap="round" />
  <line x1="11.75" y1="30" x2="22" y2="28" class="fav-line-sec" stroke-linecap="round" />
  <line x1="22" y1="28" x2="32.25" y2="24" class="fav-line-sec" stroke-linecap="round" />
  <line x1="22" y1="18.5" x2="32.25" y2="24" class="fav-line-sec" stroke-linecap="round" stroke-dasharray="2 1.5" />

  <!-- Neural nodes -->
  <circle cx="11.75" cy="25.5" r="2.0" class="fav-node-1" />
  <circle cx="11.75" cy="25.5" r="0.9" fill="#FFFFFF" />

  <circle cx="22" cy="18.5" r="2.2" class="fav-node-2" />
  <circle cx="22" cy="18.5" r="1.0" fill="#FFFFFF" />

  <circle cx="32.25" cy="11.5" r="2.4" class="fav-node-3" />
  <circle cx="32.25" cy="11.5" r="1.1" fill="#FFFFFF" />

  <circle cx="22" cy="28" r="1.5" class="fav-node-2" />
  <circle cx="22" cy="28" r="0.65" fill="#FFFFFF" />

  <circle cx="32.25" cy="24" r="1.5" class="fav-node-3" />
  <circle cx="32.25" cy="24" r="0.65" fill="#FFFFFF" />

  <!-- Insight spark -->
  <path d="M 32.25 3.5 Q 32.25 5.8 34.5 5.8 Q 32.25 5.8 32.25 8.1 Q 32.25 5.8 30 5.8 Q 32.25 5.8 32.25 3.5 Z" class="fav-spark" />
  <circle cx="32.25" cy="5.8" r="0.7" fill="#FFFFFF" />
</svg>
